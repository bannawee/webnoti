<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Push Notifications</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f4f4f4; color: #333; }
        .container { background-color: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        p { line-height: 1.6; }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background-color: #0056b3; }
        #statusArea { margin-top: 15px; font-style: italic; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Web Push Notification Demo</h1>
        <p>Welcome! Click the button below to subscribe to push notifications.</p>
        <p>You'll receive updates even if you close this page (as long as your browser is running and has permission).</p>
        
        <button id="subscribeButton">Subscribe to Notifications</button>
        
        <div id="statusArea"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
